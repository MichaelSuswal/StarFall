name: check-key
on:
  push:
    paths: ["tools/check-key.trigger"]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the OpenAI key without spending anything
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          mkdir -p tools
          if [ -z "$OPENAI_API_KEY" ]; then echo "secret: MISSING" > tools/check-key.result; else
            code=$(curl -s -o models.json -w "%{http_code}" https://api.openai.com/v1/models -H "Authorization: Bearer $OPENAI_API_KEY")
            img=$(python3 -c "import json;d=json.load(open('models.json'));print(','.join(sorted(m['id'] for m in d.get('data',[]) if 'image' in m['id'])) or 'none')" 2>/dev/null || echo unreadable)
            printf "secret: present\nmodels endpoint: HTTP %s\nimage models visible: %s\nchecked: %s\n" "$code" "$img" "$(date -u)" > tools/check-key.result
          fi
          git config user.name "starfall-painter"; git config user.email "starfall-painter@users.noreply.github.com"
          git add tools/check-key.result; git commit -m "Key check result"; git push
